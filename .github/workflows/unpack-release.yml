name: Unpack release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, '[unpack-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack deployment release into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f digital-stand-register-deployment-ready.zip
          rm -rf _release
          unzip -q digital-stand-register-deployment-ready.zip -d _release
          shopt -s dotglob
          cp -a _release/dsr_release/. ./
          rm -rf _release digital-stand-register-deployment-ready.zip backend/.pytest_cache
      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Unpack deployment-ready release [unpack-done]"
          git push
