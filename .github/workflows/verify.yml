name: Verify release
on:
  pull_request:
  push:
    branches: [main, 'release/**', 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dsr
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: dsr_release_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsr -d dsr_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DSR_TEST_DATABASE_URL: postgresql://dsr:test-only-password@localhost:5432/dsr_release_test
      DATABASE_URL: postgresql://dsr:test-only-password@localhost:5432/dsr_release_test
      SECRET_KEY: ci-test-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m compileall -q backend/app backend/scripts
      - run: python -m pytest -q --ignore=tests/postgres
        working-directory: backend
      - run: bash scripts/test-postgres.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
        working-directory: frontend
      - run: npm run test:api
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:proxy
        working-directory: frontend
      - run: npm run build:static
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://digital-stand-register-api-4g70.onrender.com/api/v1
