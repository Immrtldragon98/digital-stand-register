# Free web services in Render; DATABASE_URL comes from the dedicated Neon Free project.
services:
  - type: web
    name: digital-stand-register-api
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
  - type: web
    name: digital-stand-register-web
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: cd frontend && npm ci --include=dev && npm run test:api && npm run build
    startCommand: cd frontend && npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /operations
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DSR_API_ORIGIN
        fromService:
          name: digital-stand-register-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

